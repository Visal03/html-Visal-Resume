      ];

      const topic = topicTemplates[(dayNum - 1) % topicTemplates.length];

      return {
        day: dayNum,
        month: month,
        titleEn: `${topic.en} (Day ${dayNum})`,
        titleKh: topic.kh,
        level: level,
        wordCount: wordCount,
        difficultyStars: stars,

          { en: "my", kh: "ម៉ាយ" },
          { en: "goals.", kh: "ហ្គោលស៍" }
        ],
        translation: `ថ្ងៃនេះ ខ្ញុំបន្តដំណើរនៃការរៀនភាសាអង់គ្លេសរបស់ខ្ញុំ។ រាល់ថ្ងៃផ្តល់ឱ្យខ្ញុំនូវពាក្យថ្មីៗ និងទំនុកចិត្តកាន់តែច្រើនឡើង។ ខ្ញុំអានដោយយកចិត្តទុកដាក់ ស្តាប់សំឡេងដើម និងអនុវត្តការនិយាយឮៗ។ ជាមួយនឹងការខិតខំប្រឹងប្រែងជាប់លាប់ ខ្ញុំពិតជានឹងសម្រេចបាននូវគោលដៅរបស់ខ្ញុំ។`,

          },
          {

            desc: "ការបញ្ចេញសំឡេងឮៗ ជួយសម្របសាច់ដុំអណ្ដាត និងមាត់ឱ្យទម្លាប់នឹងខ្យល់សូរអង់គ្លេស។"

    }

    /* Build 90 Days */
    const allDaysData = [];
    for (let i = 1; i <= 90; i++) {
      allDaysData.push(generateDayData(i));
    }

    /* ==========================================================
       STATE MANAGEMENT
       ========================================================== */
    const STORAGE_KEY = "dailyenglish90_completed_data";
    let state = {
      currentDay: 1,
      currentMonthFilter: "all",
      searchQuery: "",
      showPhonetics: true,
      playbackRate: 0.85,
      completedDays: JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"),
      isPlayingFull: false
    };

    let fullTextUtterance = null;
    let wordElements = [];

    function saveProgress() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.completedDays));
      renderHeaderProgress();
      renderDaysList();
    }

    /* ==========================================================
       WEB SPEECH ENGINE
       ========================================================== */
    function speakSingleWord(wordText) {
      if (!('speechSynthesis' in window)) {
        showToast("ឧបករណ៍របស់អ្នកមិនគាំទ្រ Web Speech API ទេ!", "info");
        return;
      }
      window.speechSynthesis.cancel();
      const cleanWord = wordText.replace(/[.,/#!$%^&*;:{}=\-_`~()?"'!]/g, "");
      const u = new SpeechSynthesisUtterance(cleanWord);
      u.lang = 'en-US';
      u.rate = state.playbackRate;
      window.speechSynthesis.speak(u);
    }

    function playFullArticleSpeech() {
      if (!('speechSynthesis' in window)) {
        showToast("Browser មិនគាំទ្រការអានសំឡេងទេ", "info");
        return;
      }

      const lesson = allDaysData.find(d => d.day === state.currentDay);
      if (!lesson) return;

      if (state.isPlayingFull) {
        window.speechSynthesis.cancel();
        stopFullArticleSpeech();
        return;
      }

      window.speechSynthesis.cancel();
      const fullText = lesson.tokens.map(t => t.en).join(" ");
      fullTextUtterance = new SpeechSynthesisUtterance(fullText);
      fullTextUtterance.lang = 'en-US';
      fullTextUtterance.rate = state.playbackRate;

      wordElements = document.querySelectorAll('.word-chip');
      let currentWordCounter = 0;

      fullTextUtterance.onboundary = function(event) {
        if (event.name === 'word') {
          wordElements.forEach(el => el.classList.remove('word-highlight'));
          if (wordElements[currentWordCounter]) {
            wordElements[currentWordCounter].classList.add('word-highlight');
            wordElements[currentWordCounter].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            currentWordCounter++;
          }
        }
      };

      fullTextUtterance.onend = stopFullArticleSpeech;
      fullTextUtterance.onerror = stopFullArticleSpeech;

      state.isPlayingFull = true;
      updatePlayBtnUI(true);
      window.speechSynthesis.speak(fullTextUtterance);
    }

    function stopFullArticleSpeech() {
      state.isPlayingFull = false;
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      wordElements.forEach(el => el.classList.remove('word-highlight'));
      updatePlayBtnUI(false);
    }

    function updatePlayBtnUI(isPlaying) {
      const btn = document.getElementById("playFullAudioBtn");
      if (!btn) return;
      if (isPlaying) {
        btn.innerHTML = `<i data-lucide="square" class="w-4 h-4 fill-current"></i> បញ្ឈប់ (Stop)`;
        btn.className = "btn-3d px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-2 bg-rose-600 text-white border-b-4 border-rose-800 shadow-md";
      } else {
        btn.innerHTML = `<i data-lucide="play" class="w-4 h-4 fill-current"></i> ស្ដាប់អត្ថបទទាំងមូល`;
        btn.className = "btn-3d btn-3d-indigo px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-2 shadow-md";
      }
      lucide.createIcons();
    }

    /* ==========================================================

       ========================================================== */

      const completed = state.completedDays.length;
      const total = 90;
      const pct = Math.round((completed / total) * 100);

      document.getElementById("headerProgressText").innerText = `${completed} / ${total} ថ្ងៃ (${pct}%)`;
      document.getElementById("headerProgressBar").style.width = `${pct}%`;
    }

    /* ==========================================================

       ========================================================== */
    function renderDaysList() {
      const container = document.getElementById("daysListContainer");
      container.innerHTML = "";

      const filtered = allDaysData.filter(item => {
        const matchesMonth = state.currentMonthFilter === "all" || item.month.toString() === state.currentMonthFilter;
        const q = state.searchQuery.toLowerCase();
        const matchesSearch = q === "" || 
          item.titleEn.toLowerCase().includes(q) ||
          item.titleKh.toLowerCase().includes(q) ||
          `day ${item.day}`.includes(q);
        return matchesMonth && matchesSearch;
      });

      document.getElementById("filteredCountBadge").innerText = `${filtered.length} ថ្ងៃ`;

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="p-8 text-center text-slate-400 text-xs">
            <i data-lucide="search-x" class="w-8 h-8 mx-auto mb-2 opacity-50"></i>

          </div>

          <i data-lucide="chevron-right" class="w-4 h-4 text-slate-300 shrink-0"></i>
        `;

        container.appendChild(card);
      });

      lucide.createIcons();
    }

              <h3 class="text-sm font-bold text-indigo-950 flex items-center gap-2">
                <i data-lucide="languages" class="w-4 h-4 text-indigo-600"></i>
                អត្ថបទបកប្រែជាភាសាខ្មែរ (Khmer Translation)
              </h3>
              <button onclick="toggleTranslationBox()" id="toggleTransBtn" class="text-xs text-indigo-700 font-bold hover:underline">
                បិទ/បើក
              </button>
            </div>
            <div id="translationContent" class="text-sm sm:text-base leading-relaxed text-slate-800 mt-2 font-medium bg-white/90 p-4 rounded-2xl border border-indigo-100">
              ${lesson.translation}
            </div>
          </div>

          <!-- KEY LESSONS & USAGE SECTION -->
          <div class="bg-white rounded-3xl p-6 border border-slate-200 shadow-2xs space-y-4">
            <h3 class="text-base font-extrabold text-slate-900 flex items-center gap-2">
              <i data-lucide="sparkles" class="w-5 h-5 text-amber-500"></i>
              ចំណុចសំខាន់នៃមេរៀន និងវេយ្យាករណ៍ (Key Lessons & Grammar)
            </h3>
            
            <div class="grid grid-cols-1 gap-3">
              ${lesson.keyLessons.map(k => `
                <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200 hover:border-indigo-300 transition">
                  <h4 class="text-xs sm:text-sm font-bold text-indigo-950 mb-1 flex items-center gap-2">
                    <i data-lucide="check-circle" class="w-4 h-4 text-emerald-600"></i>
                    ${k.title}
                  </h4>
                  <div class="text-xs sm:text-sm text-slate-600 leading-relaxed pl-6 font-medium">
                    ${k.desc}
                  </div>
                </div>
              `).join("")}
            </div>
          </div>

          <!-- INTERACTIVE QUIZ (WITH 3D BUTTON OPTIONS) -->
          <div class="bg-white rounded-3xl p-6 border border-slate-200 shadow-2xs">
            <h3 class="text-base font-extrabold text-slate-900 mb-4 flex items-center gap-2">
              <i data-lucide="help-circle" class="w-5 h-5 text-indigo-600"></i>
              លំហាត់តេស្តសមត្ថភាពខ្លី (Quick Interactive Quiz)
            </h3>

            <div class="space-y-4" id="quizContainer">
              ${lesson.quiz.map((q, qIndex) => `
                <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200 text-xs sm:text-sm">
                  <p class="font-extrabold text-slate-800 mb-3 text-sm">
                    ${qIndex + 1}. ${q.question}
                  </p>
                  <div class="space-y-2.5">
                    ${q.options.map((opt, optIndex) => `
                      <button 
                        onclick="checkQuizAnswer(${lesson.day}, ${qIndex}, ${optIndex})"
                        id="quiz-btn-${qIndex}-${optIndex}"
                        class="btn-3d btn-3d-white w-full text-left p-3 rounded-xl transition text-slate-700 font-bold"
                      >
                        ${opt}
                      </button>
                    `).join("")}
                  </div>
                  <div id="quiz-feedback-${qIndex}" class="mt-3 hidden p-3 rounded-xl text-xs font-medium leading-relaxed"></div>
                </div>
              `).join("")}
            </div>
          </div>

          <!-- 3D NAVIGATION BUTTONS: PREVIOUS / NEXT DAY -->
          <div class="flex items-center justify-between pt-5 border-t border-slate-200">
            <!-- 3D Previous Button -->
            <button 
              onclick="goToDay(${lesson.day - 1})"
              ${lesson.day <= 1 ? 'disabled class="opacity-40 cursor-not-allowed btn-3d-white"' : 'class="btn-3d btn-3d-white"'}
              class="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition"
            >
              <i data-lucide="arrow-left" class="w-4 h-4"></i> ថ្ងៃមុន (Day ${lesson.day - 1})
            </button>

            <!-- 3D Next Button -->
            <button 
              onclick="goToDay(${lesson.day + 1})"
              ${lesson.day >= 90 ? 'disabled class="opacity-40 cursor-not-allowed btn-3d-indigo"' : 'class="btn-3d btn-3d-indigo"'}
              class="inline-flex items-center gap-2 px-6 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition"
            >
              <span>ថ្ងៃបន្ទាប់ (Day ${lesson.day + 1})</span>
              <i data-lucide="arrow-right" class="w-4 h-4 stroke-[2.5]"></i>
            </button>
          </div>

        </div>
      `;

      lucide.createIcons();
    }

    /* ==========================================================
       USER ACTIONS & NAVIGATION
       ========================================================== */
    function goToDay(dayNum) {
      if (dayNum < 1 || dayNum > 90) return;
      stopFullArticleSpeech();
      state.currentDay = dayNum;
      renderDaysList();
      renderLessonDetail();

      document.getElementById("sidebar").classList.add("-translate-x-full");
      document.getElementById("sidebarBackdrop").classList.add("hidden");
      document.getElementById("lessonContainer").scrollTop = 0;
    }

    function toggleDayCompleted(dayNum) {
      const idx = state.completedDays.indexOf(dayNum);
      if (idx > -1) {
        state.completedDays.splice(idx, 1);
        showToast(`បានដក Day ${dayNum} ចេញពីបញ្ជីបញ្ចប់`, "info");
      } else {
        state.completedDays.push(dayNum);
        showToast(`អបអរសាទរ! អ្នកបានរៀនចប់ Day ${dayNum} 🎉`, "success");
      }
      saveProgress();
      renderLessonDetail();
    }

    function togglePhoneticsVisibility() {
      state.showPhonetics = !state.showPhonetics;
      document.querySelectorAll('.phonetic-text').forEach(el => {
        if (state.showPhonetics) {
          el.classList.remove('hidden');
        } else {
          el.classList.add('hidden');
        }
      });
      renderLessonDetail();
    }

    function setPlaybackRate(rate) {
      state.playbackRate = rate;
      if (state.isPlayingFull) {
        stopFullArticleSpeech();
        playFullArticleSpeech();
      }
      renderLessonDetail();
    }

    function toggleTranslationBox() {
      const box = document.getElementById("translationContent");
      if (box) box.classList.toggle("hidden");
    }

    function copyLessonEnglish() {
      const lesson = allDaysData.find(d => d.day === state.currentDay);
      if (!lesson) return;
      const text = lesson.tokens.map(t => t.en).join(" ");
      navigator.clipboard.writeText(text);
      showToast("បានចម្លងអត្ថបទជាភាសាអង់គ្លេស!", "success");
    }

    function checkQuizAnswer(dayNum, qIndex, selectedIndex) {
      const lesson = allDaysData.find(d => d.day === dayNum);
      if (!lesson || !lesson.quiz[qIndex]) return;

      const q = lesson.quiz[qIndex];
      const feedbackEl = document.getElementById(`quiz-feedback-${qIndex}`);

      q.options.forEach((_, optIdx) => {
        const btn = document.getElementById(`quiz-btn-${qIndex}-${optIdx}`);
        btn.disabled = true;
        btn.classList.remove("btn-3d-white");
        if (optIdx === q.answer) {
          btn.classList.add("btn-3d-emerald", "text-white");
        } else if (optIdx === selectedIndex) {
          btn.className = "w-full text-left p-3 rounded-xl bg-rose-100 text-rose-900 border-b-4 border-rose-400 font-bold";
        }
      });

      feedbackEl.classList.remove("hidden");
      if (selectedIndex === q.answer) {
        feedbackEl.className = "mt-3 p-3 rounded-xl text-xs font-semibold leading-relaxed bg-emerald-50 border border-emerald-200 text-emerald-950";
        feedbackEl.innerHTML = `<b>ត្រឹមត្រូវណាស់! 👏</b> ${q.explain}`;
      } else {
        feedbackEl.className = "mt-3 p-3 rounded-xl text-xs font-semibold leading-relaxed bg-rose-50 border border-rose-200 text-rose-950";
        feedbackEl.innerHTML = `<b>មិនទាន់ត្រឹមត្រូវទេ!</b> ចម្លើយត្រឹមត្រូវគឺ: <i>${q.options[q.answer]}</i>។ ${q.explain}`;
      }
    }

    /* Toast Helper */
    function showToast(msg, type = "success") {
      const toast = document.getElementById("toast");
      const msgEl = document.getElementById("toastMessage");
      const iconEl = document.getElementById("toastIcon");

      msgEl.innerText = msg;
      if (type === "success") {
        iconEl.className = "w-7 h-7 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center shrink-0";
        iconEl.innerHTML = `<i data-lucide="check" class="w-4 h-4 stroke-[3]"></i>`;
      } else {
        iconEl.className = "w-7 h-7 rounded-full bg-indigo-500/20 text-indigo-400 flex items-center justify-center shrink-0";
        iconEl.innerHTML = `<i data-lucide="info" class="w-4 h-4 stroke-[3]"></i>`;
      }
      lucide.createIcons();

      toast.classList.remove("translate-y-20", "opacity-0", "pointer-events-none");
      setTimeout(() => {
        toast.classList.add("translate-y-20", "opacity-0", "pointer-events-none");
      }, 2800);
    }

    /* ==========================================================
       INITIALIZATION & EVENTS
       ========================================================== */
    document.addEventListener("DOMContentLoaded", () => {
      renderHeaderProgress();
      renderDaysList();
      renderLessonDetail();

      // Month Tabs with 3D Styles
      document.querySelectorAll(".month-tab").forEach(tab => {
        tab.addEventListener("click", () => {
          state.currentMonthFilter = tab.getAttribute("data-month");
          document.querySelectorAll(".month-tab").forEach(t => {
            if (t === tab) {
              t.className = "month-tab btn-3d btn-3d-indigo px-3.5 py-1.5 rounded-xl text-xs font-bold";
            } else {
              t.className = "month-tab btn-3d btn-3d-white px-3.5 py-1.5 rounded-xl text-xs font-bold";
            }
          });
          renderDaysList();
        });
      });

      // Search Handler
      const searchInput = document.getElementById("globalSearchInput");
      const clearBtn = document.getElementById("clearSearchBtn");

      searchInput.addEventListener("input", (e) => {
        state.searchQuery = e.target.value.trim();
        if (state.searchQuery) {
          clearBtn.classList.remove("hidden");
        } else {
          clearBtn.classList.add("hidden");
        }
        renderDaysList();
      });

      clearBtn.addEventListener("click", () => {
        searchInput.value = "";
        state.searchQuery = "";
        clearBtn.classList.add("hidden");
        renderDaysList();
      });

      // Mobile Sidebar
      const sidebar = document.getElementById("sidebar");
      const backdrop = document.getElementById("sidebarBackdrop");
      const toggleBtn = document.getElementById("sidebarToggleBtn");

      toggleBtn.addEventListener("click", () => {
        sidebar.classList.remove("-translate-x-full");
        backdrop.classList.remove("hidden");
      });

      backdrop.addEventListener("click", () => {
        sidebar.classList.add("-translate-x-full");
        backdrop.classList.add("hidden");
      });

      // Reset All Progress
      document.getElementById("resetProgressBtn").addEventListener("click", () => {
        if (confirm("តើអ្នកពិតជាចង់កំណត់វឌ្ឍនភាពសិក្សា ៩០ ថ្ងៃឡើងវិញមែនទេ?")) {
          state.completedDays = [];
          saveProgress();
          renderLessonDetail();
          showToast("បានកំណត់វឌ្ឍនភាពឡើងវិញរួចរាល់!", "info");
        }
      });
    });
  </script>
</body>
</html>
